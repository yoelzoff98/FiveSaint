<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Sombra sutil para el texto -->
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="2" dy="5" stdDeviation="4" flood-color="#004d66" flood-opacity="0.5"/>
    </filter>
    
    <!-- Gradiente de la ola para darle más dinamismo -->
    <linearGradient id="waveGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00a3cc" />
      <stop offset="50%" stop-color="#33d6ff" />
      <stop offset="100%" stop-color="#00a3cc" />
    </linearGradient>
  </defs>

  <!-- Fondo: Cuadrado redondeado de color Turquesa/Azul Spa (fiel a la marca) -->
  <rect width="512" height="512" rx="100" fill="#007299" />

  <!-- Grupo con alineación de texto y efectos -->
  <g filter="url(#shadow)">
    <!-- Texto "Five" -->
    <text x="65" y="210" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-size="125" 
          font-weight="800" 
          fill="#ffffff" 
          letter-spacing="-1">Five</text>

    <!-- Texto "Saint" -->
    <text x="65" y="340" 
          font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
          font-size="125" 
          font-weight="800" 
          fill="#ffffff" 
          letter-spacing="-1">Saint</text>
  </g>

  <!-- Subtexto "equipamientos para spa" -->
  <text x="75" y="405" 
        font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" 
        font-size="28" 
        font-weight="400" 
        fill="#9de6f2" 
        letter-spacing="1">equipamientos para spa</text>

  <!-- Ola estilizada en la parte inferior -->
  <path d="M 65,435 Q 240,405 447,435" 
        fill="none" 
        stroke="url(#waveGrad)" 
        stroke-width="7" 
        stroke-linecap="round" />
  
  <path d="M 75,447 Q 240,422 437,447" 
        fill="none" 
        stroke="#9de6f2" 
        stroke-width="2" 
        stroke-opacity="0.6" 
        stroke-linecap="round" />
</svg>
